[project]
name = "opinion-workbench-api"
version = "0.1.0"
description = "Local API for the OpinionWorkbench public opinion management system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.116.0",
    "httpx>=0.28.1,<0.29",
    "lxml>=6.0,<7",
    "playwright>=1.60,<1.62",
    "gallery-dl==1.32.10",
    "pillow>=12.3.0,<13",
    "json-repair==0.63.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.fastapi]
entrypoint = "opinion_workbench_api.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
